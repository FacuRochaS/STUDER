name: studer
services:
  db:
    container_name: studer_db
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend_net
  app-be:
    container_name: studer_app_be
    build: ../Backend/STUDER/
    depends_on:
      - db
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      JWT_SECRET: ${JWT_SECRET}
      APP_MEDIA_SERVICE_URL: http://studer-media:8000
    ports:
      - "8081:8081"
    restart: always
    networks:
      - backend_net
  studer-media:
    container_name: studer_media
    build: ../Backend/STUDER-MEDIA/
    ports:
      - "8000:8000"
    restart: always
    depends_on:
      - minio
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      BUCKET_NAME: images
    networks:
      - backend_net
  frontend:
    container_name: studer_frontend
    build: ../Frontend/STUDER/
    ports:
      - "4200:80"
    restart: always
    networks:
      - frontend_net
  nginx:
    container_name: studer_nginx
    image: nginx:alpine
    depends_on:
      - frontend
      - app-be
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "1583:1583"
    restart: always
    networks:
      - frontend_net
      - backend_net
  minio:
    container_name: studer_minio
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    networks:
      - backend_net

  # ===== EasyAI (AI assistant) =====
  easyai-api:
    container_name: studer_easyai_api
    build: ../EasyAi/
    restart: always
    ports:
      - "8001:8000"
    depends_on:
      - easyai-db
      - easyai-ollama
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@easyai-db:5432/easyai
      - OLLAMA_BASE_URL=http://easyai-ollama:11434
    volumes:
      - ../EasyAi/app:/app/app
      - ../EasyAi/scripts:/app/scripts
    networks:
      - backend_net

  easyai-db:
    container_name: studer_easyai_db
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: easyai
    ports:
      - "5433:5432"
    volumes:
      - easyai_pgdata:/var/lib/postgresql/data
    networks:
      - backend_net

  easyai-ollama:
    image: ollama/ollama:latest
    container_name: studer_easyai_ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - easyai_ollama_data:/root/.ollama
    entrypoint: >
      bash -c "
        /bin/ollama serve &
        pid=$!
        sleep 10 &&
        ollama pull qwen2.5:0.5b &
        wait $pid
      "
    networks:
      - backend_net

volumes:
  db_data:
  minio_data:
  easyai_pgdata:
  easyai_ollama_data:
networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge