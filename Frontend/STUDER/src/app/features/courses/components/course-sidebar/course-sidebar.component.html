<div class="sidebar-container">
  <ul class="nav-list">
    <li (click)="selectCategory('yours')" [class.active]="selectedCategory === 'yours'">
      <i class="pi pi-user"></i>
      <span>{{ 'course.sidebar.yours' | translate }}</span>
    </li>
    <li (click)="selectCategory('favourites')" [class.active]="selectedCategory === 'favourites'">
      <i class="pi pi-star"></i>
      <span>{{ 'course.sidebar.favourites' | translate }}</span>
    </li>
    <li (click)="selectCategory('recent')" [class.active]="selectedCategory === 'recent'">
      <i class="pi pi-history"></i>
      <span>{{ 'course.sidebar.recent' | translate }}</span>
    </li>
  </ul>

  <hr class="divider">

  <ul class="nav-list">
    <li (click)="selectCategory('popular')" [class.active]="selectedCategory === 'popular'">
      <i class="pi pi-bolt"></i>
      <span>{{ 'course.sidebar.popular' | translate }}</span>
    </li>

    <li (click)="selectCategory('explore')" [class.active]="selectedCategory === 'explore'">
      <i class="pi pi-compass"></i>
      <span>{{ 'discussion.sidebar.explore' | translate }}</span>
    </li>
  </ul>

  <hr class="divider">

  <ul class="nav-list">
    <li (click)="selectCategory('create')" [class.active]="selectedCategory === 'create'">
      <i class="pi pi-plus-circle"></i>
      <span>{{ 'course.sidebar.create' | translate }}</span>
    </li>
  </ul>
</div>
