<div class="course-container">
  <studer-course-sidebar
    (categorySelected)="onCategorySelected($event)">
  </studer-course-sidebar>

  <main class="course-content">
    @if (selectedCourseId) {
      <studer-course-detail
        [courseId]="selectedCourseId"
        [backToList]="true"
        (closed)="onDetailClosed()"
      ></studer-course-detail>
    } @else {
      @if (selectedCategory === 'explore') {
        <app-explore-filters (filtersChanged)="onFiltersChanged($event)"></app-explore-filters>
      }

      @if (showCreateForm) {
        <studer-course-create (saved)="showCreateForm = false; onCategorySelected('yours')"></studer-course-create>
      } @else if (loading) {
        <div class="loading-spinner">
          <studer-loader></studer-loader>
        </div>
      } @else {
        <studer-course-list
          [courses]="courses"
          (courseSelected)="onCourseSelected($event)"
        ></studer-course-list>
      }
    }
  </main>
</div>
