<div class="text-creator-wrapper">
  <div class="editor-toolbar">
    <div class="toolbar-group">
      <button type="button" class="tool-btn" (click)="execute('bold')" title="Negrita"><b>B</b></button>
      <button type="button" class="tool-btn" (click)="execute('italic')" title="Cursiva"><i>I</i></button>
      <button type="button" class="tool-btn" (click)="execute('underline')" title="Subrayado"><u>U</u></button>
      <button type="button" class="tool-btn" (click)="execute('strikeThrough')" title="Tachado"><s>S</s></button>
    </div>

    <div class="toolbar-divider"></div>

    <div class="toolbar-group">
      <button type="button" class="tool-btn" (click)="execute('justifyLeft')" title="Izquierda">⌸</button>
      <button type="button" class="tool-btn" (click)="execute('justifyCenter')" title="Centrar">⌺</button>
      <button type="button" class="tool-btn" (click)="execute('justifyRight')" title="Derecha">⌹</button>
      <button type="button" class="tool-btn" (click)="execute('justifyFull')" title="Justificar">⌻</button>
    </div>

    <div class="toolbar-divider"></div>

    <div class="toolbar-group">
        <select class="tool-select" (change)="changeSize($event)">
          <option value="medium" selected>{{ 'text_editor.sizes.medium' | translate }}</option>
          <option value="small">{{ 'text_editor.sizes.small' | translate }}</option>
          <option value="large">{{ 'text_editor.sizes.large' | translate }}</option>
          <option value="xlarge">{{ 'text_editor.sizes.xlarge' | translate }}</option>
        </select>

        <select class="tool-select" (change)="changeColor($event)">
          <option value="primary" selected>{{ 'text_editor.colors.primary' | translate }}</option>
          <option value="secondary">{{ 'text_editor.colors.secondary' | translate }}</option>
          <option value="blue">{{ 'text_editor.colors.blue' | translate }}</option>
          <option value="green">{{ 'text_editor.colors.green' | translate }}</option>
          <option value="orange">{{ 'text_editor.colors.orange' | translate }}</option>
          <option value="red">{{ 'text_editor.colors.red' | translate }}</option>
          <option value="purple">{{ 'text_editor.colors.purple' | translate }}</option>
        </select>
      </div>

    <div class="toolbar-divider"></div>

    <div class="toolbar-group">
      <button type="button" class="tool-btn" (click)="promptLink()" title="Enlace"><i class="fa-solid fa-link"></i></button>
      <button type="button" class="tool-btn" (click)="promptImage()" title="Imagen"><i class="fa-solid fa-image"></i></button>
    </div>
  </div>

  <div
    #editableArea
    class="editable-container"
    contenteditable="true"
    (input)="updateModel()"
    (blur)="updateModel()">
  </div>

  <!-- Link Modal -->
  @if (showLinkModal) {
    <div class="editor-modal-overlay" (click)="showLinkModal = false">
      <div class="editor-modal" (click)="$event.stopPropagation()">
        <div class="editor-modal__header">
          <span>{{ 'text_editor.insert_link' | translate }}</span>
          <button type="button" class="editor-modal__close" (click)="showLinkModal = false">&times;</button>
        </div>
        <div class="editor-modal__body">
          <input
            [(ngModel)]="linkUrl"
            class="editor-modal__input"
            placeholder="https://..."
            autofocus
            (keyup.enter)="insertLink()" />
        </div>
        <div class="editor-modal__footer">
          <button type="button" class="editor-modal__btn editor-modal__btn--cancel" (click)="showLinkModal = false">
            {{ 'common.cancel' | translate }}
          </button>
          <button type="button" class="editor-modal__btn editor-modal__btn--confirm" (click)="insertLink()" [disabled]="!linkUrl">
            {{ 'text_editor.insert' | translate }}
          </button>
        </div>
      </div>
    </div>
  }

  <!-- Image Upload Modal -->
  @if (showImageModal) {
    <div class="editor-modal-overlay" (click)="showImageModal = false">
      <div class="editor-modal" (click)="$event.stopPropagation()">
        <div class="editor-modal__header">
          <span>{{ 'text_editor.insert_image' | translate }}</span>
          <button type="button" class="editor-modal__close" (click)="showImageModal = false">&times;</button>
        </div>
        <div class="editor-modal__body">
          <label class="editor-modal__upload-label">
            @if (imageUploading) {
              <span class="pi pi-spin pi-spinner"></span>
              <span>{{ 'common.uploading' | translate }}</span>
            } @else {
              <input type="file" accept="image/*" (change)="onImageSelected($event)" />
              <i class="pi pi-cloud-upload"></i>
              <span>{{ 'text_editor.click_to_upload' | translate }}</span>
            }
          </label>
        </div>
        <div class="editor-modal__footer">
          <button type="button" class="editor-modal__btn editor-modal__btn--cancel" (click)="showImageModal = false">
            {{ 'common.cancel' | translate }}
          </button>
        </div>
      </div>
    </div>
  }
</div>
