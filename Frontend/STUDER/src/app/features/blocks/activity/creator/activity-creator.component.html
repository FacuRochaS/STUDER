<div class="activity">
  <div class="type-select">
    <label>{{ 'activity.creator.type_label' | translate }}</label>
    <select class="type-dropdown" [(ngModel)]="data.activityType" (ngModelChange)="onTypeChange()">
      <option value="multiple_choice">{{ 'activity.types.multiple_choice' | translate }}</option>
      <option value="matching">{{ 'activity.types.matching' | translate }}</option>
      <option value="ordering">{{ 'activity.types.ordering' | translate }}</option>
    </select>
  </div>

  <div class="statement">
    <label>{{ 'activity.creator.statement_title' | translate }}</label>
    <input type="text" class="inp" [(ngModel)]="statementText" (ngModelChange)="onStatementChange()"
      placeholder="{{ 'activity.creator.placeholders.statement_text' | translate }}">
  </div>

  <div class="options">
    <label>{{ 'activity.creator.options_title' | translate }}</label>
    <div class="options-list">
      @for (option of data.options; track option.id; let i = $index) {
        <div class="opt-row">
          <span class="opt-num">{{ i + 1 }}</span>
          <input type="text" class="inp" [(ngModel)]="option.text" (ngModelChange)="updateModel()"
            placeholder="{{ 'activity.creator.placeholders.option_text' | translate }}">
          @if (option.imageUrl) {
            <div class="opt-img" [style.background-image]="'url(' + option.imageUrl + ')'">
              <button class="opt-img-x" (click)="option.imageUrl = null; updateModel()"><i class="pi pi-times"></i></button>
            </div>
          }
          <label class="opt-upload">
            <i class="fa-solid fa-image"></i>
            <input type="file" accept="image/*" (change)="onOptionImageSelected($event, i)" hidden />
          </label>

          @if (data.activityType === 'multiple_choice') {
            <button class="opt-bool" [class.is-true]="option.isCorrect" (click)="toggleCorrect(option)">
              <i class="pi" [ngClass]="option.isCorrect ? 'pi-check-circle' : 'pi-circle'"></i>
            </button>
          } @else if (data.activityType === 'matching') {
            <input type="text" class="inp match" [(ngModel)]="option.matchText" (ngModelChange)="updateModel()"
              placeholder="{{ 'activity.creator.placeholders.match_key' | translate }}">
          } @else if (data.activityType === 'ordering') {
            <span class="opt-order">{{ option.orderIndex }}</span>
          }
          <button class="opt-del" (click)="removeOption(i)"><i class="pi pi-trash"></i></button>
        </div>
      }
    </div>
    <button class="add-opt" (click)="addOption()"><i class="pi pi-plus"></i> {{ 'activity.creator.add_option' | translate }}</button>
  </div>
</div>
